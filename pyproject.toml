[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
extend-select = ["B", "SIM", "PLW"]   # bugbear, simplify, pylint-warnings — on top of ruff's defaults (E/F)
ignore = ["B008"]                      # FastAPI idiom: Body(...)/File(...)/Query(...) in arg defaults

[tool.ruff.lint.per-file-ignores]
"db.py" = ["PLW0603"]               # intentional lazy table-allowlist cache: _MAINT_TABLE_ALLOWLIST
"server/priority_lists/cache.py" = ["PLW0603"]  # intentional module-level priority-list cache: PLANT_LISTS / CW_LOADED_AT (moved here from brain.py in P5)

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "pg: requires a reachable Postgres database (auto-skipped when the DB is down)",
]
