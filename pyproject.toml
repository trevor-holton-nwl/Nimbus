[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
extend-select = ["B", "SIM", "PLW"]   # bugbear, simplify, pylint-warnings — on top of ruff's defaults (E/F)
ignore = ["B008"]                      # FastAPI idiom: Body(...)/File(...)/Query(...) in arg defaults

[tool.ruff.lint.per-file-ignores]
"brain.py" = ["PLW0603"]               # intentional module-level color-wheel cache: GLOBAL_CW / PLANT_CWS / CW_LOADED_AT
"db.py"    = ["PLW0603"]               # intentional lazy table-allowlist cache: _MAINT_TABLE_ALLOWLIST
