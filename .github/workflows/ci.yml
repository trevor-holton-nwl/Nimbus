name: CI

# First automated gate for NIMBUS: JS lint + JS unit tests, and the Python
# suite against a real Postgres so the @pytest.mark.pg data-integrity /
# schema-idempotency tests actually run (they auto-skip locally when no DB).
on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test-js:
    name: ESLint + JS unit tests
    runs-on: ubuntu-latest
    env:
      TZ: America/New_York
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: TypeScript typecheck
        # Fast-fail, clearly-labeled gate for the modules migrated per
        # docs/archive/typescript_migration.md — distinct from the JS-focused ESLint/test
        # steps below. `npm test`'s `pretest` hook also runs `npm run build`, but this
        # runs first so a type error reads as a type error, not a buried test failure.
        run: npm run typecheck
      - name: ESLint gate (JS source — errors block)
        # Blocking gate over the hand-written JS (app.js, intelligence, worker,
        # compute-core). Kept green.
        run: npm run lint:ci
      - name: ESLint full gate (incl. locales — errors block)
        # Locales' pre-existing duplicate-key errors (CODE_REVIEW_FINDINGS.md
        # Appendix A.1) are fixed; this now runs as the sole, blocking copy.
        run: npm run lint:errors
      - name: JS unit tests
        run: npm test
      - name: Legacy surface contract
        run: npm run check:legacy-surface
      - name: Static asset boundary
        run: npm run check:static-assets

  api-types-in-sync:
    name: Generated API types in sync
    # Re-dumps the FastAPI OpenAPI schema and fails if the committed
    # frontend/types/api-generated.d.mts differs. No database needed:
    # scripts/dump_openapi.py sets NIMBUS_PG_POOL_MIN=0 before importing brain.
    runs-on: ubuntu-latest
    env:
      PG_HOST: localhost
      PG_PORT: '5432'
      PG_DB: nimbus
      PG_USER: postgres
      PG_PASS: postgres
      NIMBUS_PG_POOL_MIN: '0'
      COLOR_FILE: /tmp/color_wheel.xlsx
      COLOR_WHEEL_DIR: /tmp/color_wheels
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: npm ci
      - run: python -m pip install -r requirements.txt
      - name: Regenerate API types
        run: npm run generate:api-types
      - name: Fail if api-generated.d.mts is stale
        run: git diff --exit-code frontend/types/api-generated.d.mts

  lint-python:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install ruff==0.15.19
      - run: python -m ruff check .

  test-python:
    name: pytest (with Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nimbus
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NIMBUS_TEST_DB: '1'
      NIMBUS_REQUIRE_TEST_DB: '1'
      PG_HOST: localhost
      PG_PORT: '5432'
      PG_DB: nimbus
      PG_USER: postgres
      PG_PASS: postgres
      # brain.py reads these (os.getenv), defaulting to a local Windows path;
      # point them at temp paths so `import brain` succeeds on the runner.
      COLOR_FILE: /tmp/color_wheel.xlsx
      COLOR_WHEEL_DIR: /tmp/color_wheels
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Bootstrap schema
        run: psql -v ON_ERROR_STOP=1 "postgresql://postgres:postgres@localhost:5432/nimbus" -f schema.sql
      - name: Schema bootstrap smoke
        env:
          PGPASSWORD: ${{ env.PG_PASS }}
        run: python scripts/schema_bootstrap_smoke.py
      - name: Run tests
        run: pytest -ra
