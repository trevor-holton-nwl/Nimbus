name: CI

# First automated gate for NIMBUS: JS lint + JS unit tests, and the Python
# suite against a real Postgres so the @pytest.mark.pg data-integrity /
# schema-idempotency tests actually run (they auto-skip locally when no DB).
on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test-js:
    name: ESLint + JS unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: TypeScript typecheck
        # Fast-fail, clearly-labeled gate for the modules migrated per
        # docs/archive/typescript_migration.md — distinct from the JS-focused ESLint/test
        # steps below. `npm test`'s `pretest` hook also runs `npm run build`, but this
        # runs first so a type error reads as a type error, not a buried test failure.
        run: npm run typecheck
      - name: ESLint gate (JS source — errors block)
        # Blocking gate over the hand-written JS (app.js, intelligence, worker,
        # compute-core). Kept green.
        run: npm run lint:ci
      - name: ESLint full report (locales — non-blocking)
        # Surfaces the pre-existing duplicate-key errors in locales/*.js
        # (CODE_REVIEW_FINDINGS.md Appendix A.1). Non-blocking until that
        # separate i18n cleanup lands; flip to blocking once locales are clean.
        run: npm run lint:errors
        continue-on-error: true
      - name: ESLint full gate
        run: npm run lint:errors
      - name: JS unit tests
        run: npm test
      - name: Legacy surface contract
        run: npm run check:legacy-surface
      - name: Static asset boundary
        run: npm run check:static-assets

  test-python:
    name: pytest (with Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nimbus
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NIMBUS_TEST_DB: '1'
      PG_HOST: localhost
      PG_PORT: '5432'
      PG_DB: nimbus
      PG_USER: postgres
      PG_PASS: postgres
      # brain.py reads these (os.getenv), defaulting to a local Windows path;
      # point them at temp paths so `import brain` succeeds on the runner.
      COLOR_FILE: /tmp/color_wheel.xlsx
      COLOR_WHEEL_DIR: /tmp/color_wheels
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff
      - name: Ruff
        run: python -m ruff check .
      - name: Bootstrap schema
        run: psql "postgresql://postgres:postgres@localhost:5432/nimbus" -f schema.sql
      - name: Run tests
        run: pytest -ra
